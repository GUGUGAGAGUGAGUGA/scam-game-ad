<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>詐騙手遊廣告實體化</title>
  <style>
    /* 👑 繼承你首頁的核心迷因特效變數 */
    :root {
      --stability-float: 8px;
      --stability-rotate: 1deg;
      --stability-glitch: 2px;
      --bg-speed: 30s;
    }

    body {
      margin: 0;
      padding: 0;
      /* 👑 讓背景可以使用你的光污染漸層與速度變數 */
      background: linear-gradient(to right, #0d276b 0%, #8b0000 100%);
      background-size: 200% 200%;
      animation: gradientBG var(--bg-speed) ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    canvas {
      box-shadow: 0px 0px 40px rgba(0, 0, 0, 0.8);
      border-radius: 12px; 
      border: 2px solid #000;
      max-height: 95vh;
      width: auto !important;
      /* 👑 讓遊戲畫面跟隨穩定度一起晃動！ */
      animation: gameFloat 2s ease-in-out infinite alternate;
    }

    @keyframes gameFloat { 
      0% { transform: translateY(0) rotate(calc(var(--stability-rotate) * -1)); } 
      100% { transform: translateY(calc(var(--stability-float) * -1)) rotate(var(--stability-rotate)); } 
    }

    /* 👑 完美的 440px 寬度浮動設定卡片 */
    #settingsOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px);
      z-index: 999; display: none; align-items: center; justify-content: center;
    }
    .settings-card {
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
      border: 4px solid #ffcc00; padding: 25px; border-radius: 24px; color: white;
      width: 440px; max-height: 80vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      font-family: sans-serif;
    }
    .settings-header { margin-bottom: 15px; color: #fff200; border-bottom: 2px dashed #ffcc00; padding-bottom: 5px; text-align: center; }
    .settings-content { flex-grow: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 15px; }
    .settings-content::-webkit-scrollbar { width: 6px; }
    .settings-content::-webkit-scrollbar-thumb { background: #ffcc00; border-radius: 10px; }
    .setting-item { margin: 12px 0; display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: rgba(255,255,255,0.05); padding: 10px 14px; border-radius: 8px; gap: 10px; }
    .setting-item label { width: 55%; line-height: 1.3; white-space: nowrap; }
    .setting-item input[type="range"] { width: 40%; accent-color: #fff200; }
    .btn { background: linear-gradient(135deg, #fff200 0%, #ffaa00 100%); border: 4px solid #111; padding: 10px 25px; font-size: 18px; font-weight: bold; color: #111; cursor: pointer; border-radius: 12px; }

    /* 返回首頁常駐按鈕 */
    .home-back-btn {
      position: fixed; top: 20px; left: 20px; z-index: 100;
      background: #333; color: white; border: 2px solid white;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
    }
  </style>
</head>
<body>
  <button class="home-back-btn" onclick="window.location.href='./home.html'">🏠 返回主選單</button>

  <div id="game-container"></div>
  <div id="load-error"></div>

  <div id="settingsOverlay">
    <div class="settings-card">
      <h2 class="settings-header">⚙️ 終極迷因遊戲設定 </h2>
      <div class="settings-content">
        <div class="setting-item"><label>⚖️ 網頁物件穩定度</label><input type="range" id="stabilityControl" min="0" max="100" value="100" oninput="updateStability()"></div>
        <div class="setting-item"><label>🌍 網頁地心引力參數</label><input type="range" id="gravityControl" min="0" max="100" value="50" oninput="updateGravity()"></div>
        <div class="setting-item"><label>⚡ 光污染動態閃爍頻率</label><input type="range" id="bgSpeedControl" min="1" max="100" value="1" oninput="updateBgEffects()"></div>
        <div class="setting-item"><label>🌈 萬花筒色彩豐富度</label><input type="range" id="bgPaletteControl" min="2" max="20" value="2" oninput="updateBgEffects()"></div>
      </div>
      <button class="btn" onclick="closeSettings()">💾 儲存並關閉設定</button>
    </div>
  </div>

  <script>
    const PHASER_CDNS = [
      'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js',
      'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js',
    ];

    const GAME_SCRIPTS = [
      './js/config/GameConfig.js',
      './js/scenes/MenuScene.js',
      './js/scenes/GameScene.js',
      './js/scenes/GameOverScene.js',
      './js/main.js',
    ];

    function showError(msg) {
      const box = document.getElementById('load-error');
      box.style.display = 'block';
      box.innerHTML = msg;
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve(src);
        s.onerror = () => reject(new Error('無法載入: ' + src));
        document.body.appendChild(s);
      });
    }

    async function loadPhaser() {
      for (const url of PHASER_CDNS) {
        try {
          await loadScript(url);
          if (typeof Phaser !== 'undefined') return url;
        } catch (_) { /* 嘗試下一個 CDN */ }
      }
      throw new Error('Phaser 載入失敗（CDN 可能被阻擋）');
    }

    function createWebBubble() {
      const bubble = document.createElement('div');
      bubble.classList.add('web-bubble');
      const size = Math.random() * 30 + 10;
      bubble.style.width = `${size}px`;
      bubble.style.height = `${size}px`;
      bubble.style.left = `${Math.random() * 100}vw`;

      const colors = [
        'rgba(136, 204, 255, 0.5)',
        'rgba(204, 136, 255, 0.5)',
        'rgba(170, 136, 255, 0.5)'
      ];
      bubble.style.background = colors[Math.floor(Math.random() * colors.length)];
      const duration = Math.random() * 6 + 6;
      bubble.style.animationDuration = `${duration}s`;
      document.body.appendChild(bubble);
      setTimeout(() => { bubble.remove(); }, duration * 1000);
    }

    async function boot() {
      try {
        await loadPhaser();
        for (const src of GAME_SCRIPTS) {
          await loadScript(src);
        }
        if (typeof Phaser === 'undefined') { throw new Error('Phaser 未定義'); }
        if (typeof MenuScene === 'undefined' || typeof GameScene === 'undefined') { throw new Error('遊戲腳本未正確載入'); }
      } catch (err) {
        console.error(err);
        showError('<strong>遊戲載入失敗</strong><br><br>' + (err.message || String(err)));
      }
    }

    /* 👑 環境控制器邏輯區 */
    function openSettings() { document.getElementById('settingsOverlay').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }
    
    function updateStability() {
      let value = document.getElementById('stabilityControl').value;
      let instability = 100 - value;
      document.documentElement.style.setProperty('--stability-float', `${(instability * 0.5) + 4}px`);
      document.documentElement.style.setProperty('--stability-rotate', `${(instability * 0.15) + 0.5}deg`);
    }
    
    function updateGravity() {
      // 可以在這裡擴充控制 Phaser 的物理引擎重力
    }
    
    function updateBgEffects() {
      let speedVal = document.getElementById('bgSpeedControl').value;
      document.documentElement.style.setProperty('--bg-speed', `${30 - (speedVal * 0.295)}s`);
      
      let colorCount = parseInt(document.getElementById('bgPaletteControl').value);
      const colorPalette = ["#0d276b", "#8b0000", "#fff200", "#ff5500", "#00a8ff"];
      document.body.style.backgroundImage = `linear-gradient(to right, ${colorPalette.slice(0, colorCount).join(', ')})`;
    }

    boot();
    
    // 👑 允許在遊戲中任何地方點擊滑鼠滑鼠雙擊彈出設定面板！
    // 註解掉這一行，就不會再玩一玩誤觸了：
    // window.addEventListener('dblclick', openSettings);
  </script>
</body>
</html>
